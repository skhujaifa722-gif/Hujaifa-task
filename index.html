<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hujaifa Task</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://sad.adsgram.ai/js/sad.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui;padding:16px;padding-bottom:90px}h2{margin:10px 0 18px}.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:18px;padding:18px;margin-bottom:14px}.balance{font-size:30px;font-weight:800;color:#facc15;margin-top:6px}.sub{color:#a1a1aa;font-size:13px;margin-top:4px}.btn{background:#27272a;color:#fff;border:0;width:100%;padding:16px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer}.yellow{background:#facc15;color:#000}.small{font-size:12px;color:#71717a;margin-top:8px;text-align:center}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;align-items:center;justify-content:center;padding:20px}.modalBox{background:#1e1e1e;border-radius:20px;padding:22px;width:100%;max-width:360px;border:1px solid #333;text-align:center}.tapArea{width:100%;height:120px;background:#27272a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:44px;margin:14px 0}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#27272a;color:#fff;margin-top:10px;word-break:break-all}.linkBox{background:#27272a;border:1px dashed #444;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;word-break:break-all;color:#facc15}</style></head><body>
<h2>👋 Hi Hujaifa!</h2>
<div class="card"><div class="sub">💰 Current Balance</div><div class="balance" id="b">₹20.00</div><div class="sub">Invites: <span id="inv">0</span></div></div>
<div class="card"><div style="font-weight:700">🎬 Earn by Watching Ads</div><button class="btn yellow" id="adBtn" style="margin-top:12px">▶️ Watch Ad +₹2</button><div class="small" id="adInfo">Loading...</div></div>
<div class="card"><button class="btn" id="dailyBtn">✅ Daily Check-in +₹2</button><div class="small" id="dailyInfo"></div></div>
<div class="card"><button class="btn" id="gameBtn">🎮 Play Game +₹5</button><div class="small">Tap 10 times to win</div></div>
<div class="card"><button class="btn" id="inviteBtn">👥 Invite Friends +₹10</button><div class="small">Share link & earn</div></div>
<div class="card"><button class="btn" id="joinBtn">🎁 Join @HujaifaHS = +₹10</button><div class="small" id="joinInfo"></div></div>
<button class="btn yellow" id="wdBtn">💰 Withdraw - Min ₹100</button>

<!-- Game Modal -->
<div class="modal" id="gameModal"><div class="modalBox"><h3>🎮 Tap Game</h3><div class="tapArea" id="tapArea">👆 0/10</div><div id="gameResult" class="sub"></div><button class="btn" id="closeGame">Close</button></div></div>

<!-- Invite Modal - NEW -->
<div class="modal" id="inviteModal"><div class="modalBox">
<h3>👥 Invite & Earn ₹10</h3><div class="sub">Share your link, friend joins = you get ₹10</div>
<div class="linkBox" id="inviteLink">Generating...</div>
<button class="btn yellow" id="copyLink">📋 Copy Link</button>
<button class="btn" id="shareTG" style="margin-top:8px">✈️ Share on Telegram</button>
<div class="small" id="inviteInfo2" style="margin-top:12px"></div>
<button class="btn" id="closeInvite" style="margin-top:10px;background:#27272a">Close</button>
</div></div>

<!-- Bank Modal -->
<div class="modal" id="bankModal"><div class="modalBox"><h3>🏦 Add UPI</h3><input class="input" id="bankName" placeholder="Full Name"><input class="input" id="bankUpi" placeholder="UPI ID - ex: 98765@upi"><button class="btn yellow" id="saveBank" style="margin-top:14px">💾 Save & Withdraw</button><button class="btn" id="closeBank" style="margin-top:8px">Cancel</button></div></div>

<script>
let tg=null; try{tg=window.Telegram.WebApp; tg.ready(); tg.expand();}catch(e){}
let bal=20; try{bal=parseInt(localStorage.getItem('hujaifa_bal')||'20')}catch(e){};
let lastDaily=""; try{lastDaily=localStorage.getItem('hujaifa_daily')||""}catch(e){};
let joined=false; try{joined=localStorage.getItem('hujaifa_joined')==='yes'}catch(e){};
let invites=0; try{invites=parseInt(localStorage.getItem('hujaifa_inv')||'0')}catch(e){};
let lastGame=""; try{lastGame=localStorage.getItem('hujaifa_game')||""}catch(e){};
let bankData=null; try{bankData=JSON.parse(localStorage.getItem('hujaifa_bank')||'null')}catch(e){};

let elB=document.getElementById('b'); let elInv=document.getElementById('inv');
function save(){try{localStorage.setItem('hujaifa_bal',bal)}catch(e){}; elB.innerText='₹'+bal+'.00'; elInv.innerText=invites;}
save(); updateInfos();
function updateInfos(){let today=new Date().toDateString(); document.getElementById('dailyInfo').innerText= lastDaily===today ? '✅ Today claimed' : '🕒 Available today'; document.getElementById('joinInfo').innerText= joined ? '✅ Already claimed ₹10' : 'Click to join @HujaifaHS'; document.getElementById('inviteInfo2').innerText='Total invites: '+invites+' | Today you can earn max 3 invites (₹30)';}
function add(n){bal+=n; save();}

document.getElementById('dailyBtn').onclick=function(){
 let today=new Date().toDateString(); if(lastDaily===today){alert('❌ Already claimed today!'); return;}
 lastDaily=today; try{localStorage.setItem('hujaifa_daily',today)}catch(e){}; add(2); updateInfos(); alert('✅ Daily +₹2 Added!');
};

let taps=0,timer=null,gameActive=false;
document.getElementById('gameBtn').onclick=function(){
 let today=new Date().toDateString(); if(lastGame===today){alert('❌ Already played today!'); return;}
 document.getElementById('gameModal').style.display='flex'; taps=0; gameActive=true;
 document.getElementById('tapArea').innerText='👆 0/10'; document.getElementById('gameResult').innerText='Tap fast!';
 clearTimeout(timer); timer=setTimeout(()=>{if(gameActive&&taps<10){document.getElementById('gameResult').innerText='❌ Too slow!'; gameActive=false;}},5000);
};
document.getElementById('tapArea').onclick=function(){if(!gameActive)return; taps++; document.getElementById('tapArea').innerText='👆 '+taps+'/10'; if(taps>=10){gameActive=false; clearTimeout(timer); document.getElementById('gameResult').innerText='🎉 You Win! +₹5'; lastGame=new Date().toDateString(); try{localStorage.setItem('hujaifa_game',lastGame)}catch(e){}; add(5); alert('🎉 Game Win +₹5!'); setTimeout(()=>{document.getElementById('gameModal').style.display='none';},800);}};
document.getElementById('closeGame').onclick=function(){document.getElementById('gameModal').style.display='none';};
